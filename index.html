<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mumu Hunt</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Look-at Component (Ghosts auto-face camera) -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Overlay UI */
        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 5px black;
            pointer-events: none;
        }

        #message {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        #score {
            font-size: 18px;
            margin: 0;
        }

        /* Start Screen Modal */
        #start-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-btn {
            margin-top: 20px;
            padding: 15px 32px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        /* Webcam Background Stream */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* A-Frame Canvas Overlay */
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Camera Background Feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Top UI -->
    <div id="ui">
        <p id="message">👀 LOOK AROUND THE ROOM! 😱</p>
        <p id="score">Mumu Found: 0 / 3</p>
    </div>

    <!-- Start Overlay -->
    <div id="start-modal">
        <h2>Mumu Room Hunt</h2>
        <p>Rotate your phone 360° around your room to locate all hidden ghosts.</p>
        <button id="start-btn" onclick="startGame()">START HUNT</button>
    </div>

    <!-- A-Frame 3D Scene -->
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <!-- Unique Assets -->
        <a-assets>
            <img id="mumu1" src="assets/mumu1.png">
            <img id="mumu2" src="assets/mumu2.png">
            <img id="mumu3" src="assets/mumu3.png">
        </a-assets>

        <!-- Camera with Gyroscope Controls -->
        <a-camera id="main-cam" look-controls="magicWindowTrackingEnabled: true"></a-camera>

        <!-- Container for Ghosts -->
        <a-entity id="ghost-container"></a-entity>

    </a-scene>

    <script>
        let score = 0;
        const totalGhosts = 3;
        const spawnedPositions = []; // Tracks spawned coordinates to prevent overlaps
        const MIN_GHOST_DISTANCE = 2.0; // Minimum distance (meters) between ghosts

        // Register custom A-Frame component to dynamically scale ghosts based on proximity to camera
        AFRAME.registerComponent('dynamic-scale', {
            init: function () {
                this.cameraEl = document.querySelector('#main-cam');
                this.maxSize = 2.8; // Human size scale when close
                this.minSize = 1.0; // Distant size scale
                this.closeDist = 1.5; // Distance (m) where ghost reaches max size
                this.farDist = 5.0;  // Distance (m) where ghost stays min size
            },
            tick: function () {
                if (!this.el.getAttribute('visible')) return;

                const ghostPos = this.el.object3D.position;
                const camPos = this.cameraEl.object3D.position;

                // Calculate Euclidean distance between camera and ghost
                const distance = ghostPos.distanceTo(camPos);

                // Interpolate scale ratio based on distance
                let factor = (this.farDist - distance) / (this.farDist - this.closeDist);
                factor = Math.max(0, Math.min(1, factor)); // Clamp between 0 and 1

                const currentSize = this.minSize + factor * (this.maxSize - this.minSize);
                this.el.setAttribute('width', currentSize);
                this.el.setAttribute('height', currentSize);
            }
        });

        // Initialize Webcam
        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                const videoElement = document.getElementById("webcam");
                videoElement.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or unavailable.");
                console.error(err);
            }
        }

        // Start Game Handler
        async function startGame() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert("Permission to access motion sensors was denied.");
                        return;
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            await setupWebcam();
            document.getElementById("start-modal").style.display = "none";
            spawnGhostsRandomly();
        }

        // Calculate Euclidean distance between 3D points
        function getDistance3D(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dz = p1.z - p2.z;
            return Math.sqrt(dx * dx + dy * dy + dz * dz);
        }

        // Random Spawner Function with Anti-Overlap Logic
        function spawnGhostsRandomly() {
            const container = document.getElementById("ghost-container");
            const assets = ["#mumu1", "#mumu2", "#mumu3"];

            assets.forEach((asset, index) => {
                let positionFound = false;
                let candidatePos = { x: 0, y: 0, z: 0 };
                let attempts = 0;

                // Loop until candidate position satisfies minimum distance separation from other ghosts
                while (!positionFound && attempts < 100) {
                    attempts++;
                    const angle = Math.random() * Math.PI * 2;

                    // Vary distances: Index 0 is close (jumpscare), others are further away
                    const distance = (index === 0) 
                        ? (Math.random() * 0.5 + 1.5)  // 1.5m - 2.0m away
                        : (Math.random() * 2.5 + 2.5); // 2.5m - 5.0m away

                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;
                    const y = (Math.random() * 1.0) - 0.2; // Eye level (-0.2m to +0.8m)

                    candidatePos = { x, y, z };

                    // Check distance against all previously placed ghosts
                    const tooClose = spawnedPositions.some(pos => getDistance3D(pos, candidatePos) < MIN_GHOST_DISTANCE);

                    if (!tooClose || spawnedPositions.length === 0) {
                        positionFound = true;
                        spawnedPositions.push(candidatePos);
                    }
                }

                const ghost = document.createElement("a-image");
                ghost.setAttribute("id", `ghost${index + 1}`);
                ghost.setAttribute("class", "clickable");
                ghost.setAttribute("src", asset);
                ghost.setAttribute("position", `${candidatePos.x.toFixed(2)} ${candidatePos.y.toFixed(2)} ${candidatePos.z.toFixed(2)}`);
                ghost.setAttribute("look-at", "#main-cam");

                // Attach dynamic proximity scaling component
                ghost.setAttribute("dynamic-scale", "");

                // Click / Tap Handler
                ghost.addEventListener("click", function () {
                    if (this.getAttribute("visible") === "false") return;

                    this.setAttribute("visible", "false");
                    score++;

                    document.getElementById("score").innerText = `Mumu Found: ${score} / ${totalGhosts}`;

                    if (score === totalGhosts) {
                        document.getElementById("message").innerText = "🎉 YOU CLEARED THE ROOM! 🎉";
                    }
                });

                container.appendChild(ghost);
            });
        }
    </script>
</body>
</html>
