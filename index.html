<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mumu Room Hunt - Speedrun Mode</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Look-at Component (Ghosts auto-face camera) -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Overlay UI */
        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 5px black;
            pointer-events: none;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        #sub-message {
            font-size: 16px;
            color: #ff4757;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        #score {
            font-size: 18px;
            margin: 0 0 5px 0;
        }

        #timer {
            font-size: 22px;
            color: #ffeb3b;
            font-weight: bold;
            margin: 0;
        }

        /* Start / End Screen Modal */
        #start-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #player-name-input {
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            text-align: center;
            margin-top: 15px;
            width: 80%;
            max-width: 250px;
        }

        #start-btn {
            margin-top: 20px;
            padding: 15px 32px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        /* Webcam Background Stream */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* A-Frame Canvas Overlay */
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Camera Background Feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Top UI -->
    <div id="ui">
        <p id="message">SEARCH THE ROOM!</p>
        <p id="sub-message">⚠️ BEWARE OF RED DECOYS!</p>
        <p id="score">Ghosts Captured: 0 / 3</p>
        <p id="timer">⏱️ Time: 0s</p>
    </div>

    <!-- Start / End Overlay -->
    <div id="start-modal">
        <h2 id="modal-title">Mumu Room Hunt</h2>
        <p id="modal-desc">
            • Tap ghosts 3 times rapidly to capture!<br>
            • They vanish & move every 3 SECONDS!<br>
            • Avoid the RED DECOY (+5s Penalty)!
        </p>
        <input type="text" id="player-name-input" placeholder="Enter Your Name" maxlength="15">
        <button id="start-btn" onclick="startGame()">START HUNT</button>
    </div>

    <!-- A-Frame 3D Scene -->
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <a-assets>
            <img id="mumu1" src="assets/mumu1.png">
            <img id="mumu2" src="assets/mumu2.png">
            <img id="mumu3" src="assets/mumu3.png">
        </a-assets>

        <a-camera id="main-cam" look-controls="magicWindowTrackingEnabled: true"></a-camera>

        <a-entity id="ghost-container"></a-entity>

    </a-scene>

    <script>
        let score = 0;
        const totalGhosts = 3;
        let currentTapsLeft = 3;
        let fleeTimer = null;
        let currentGhostEl = null;

        let playerName = "Player";
        let startTime = 0;
        let penaltyTime = 0;
        let timerInterval = null;

        // Base width for images
        const GHOST_BASE_WIDTH = 3.8; 

        // Time ghost stays in one spot before vanishing/relocating (in ms)
        const FLEE_INTERVAL_MS = 3000; 

        const ghostAssets = ["#mumu1", "#mumu2", "#mumu3"];

        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                document.getElementById("webcam").srcObject = stream;
            } catch (err) {
                alert("Camera access denied.");
            }
        }

        async function startGame() {
            const inputVal = document.getElementById("player-name-input").value.trim();
            if (inputVal !== "") playerName = inputVal;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
            }

            await setupWebcam();
            document.getElementById("start-modal").style.display = "none";

            // Start Stopwatch
            startTime = Date.now();
            penaltyTime = 0;

            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000) + penaltyTime;
                document.getElementById("timer").innerText = `⏱️ Time: ${elapsedSeconds}s`;
            }, 1000);

            spawnNextRound();
        }

        function getRandomPosition(minDist = 2.0, maxDist = 4.0) {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * (maxDist - minDist) + minDist;
            const x = Math.cos(angle) * distance;
            const z = Math.sin(angle) * distance;
            const y = (Math.random() * 1.0) - 0.2;
            return { x: x.toFixed(2), y: y.toFixed(2), z: z.toFixed(2) };
        }

        function getImageDimensions(assetId, targetWidth) {
            const imgEl = document.querySelector(assetId);
            const nativeWidth = imgEl.naturalWidth || 512;
            const nativeHeight = imgEl.naturalHeight || 512;
            const aspectRatio = nativeHeight / nativeWidth;
            
            return {
                width: targetWidth,
                height: targetWidth * aspectRatio
            };
        }

        function spawnNextRound() {
            const container = document.getElementById("ghost-container");
            container.innerHTML = "";
            if (fleeTimer) clearInterval(fleeTimer);

            currentTapsLeft = 3;
            document.getElementById("message").innerText = `👻 Ghost #${score + 1} Sighted! Tap 3 Times FAST!`;
            document.getElementById("sub-message").innerText = "⏱️ You have 3 seconds per spot!";

            const realAsset = ghostAssets[score % ghostAssets.length];
            const pos = getRandomPosition(2.0, 4.0);

            const dims = getImageDimensions(realAsset, GHOST_BASE_WIDTH);

            const ghost = document.createElement("a-image");
            ghost.setAttribute("class", "clickable");
            ghost.setAttribute("src", realAsset);
            ghost.setAttribute("position", `${pos.x} ${pos.y} ${pos.z}`);
            ghost.setAttribute("width", dims.width);
            ghost.setAttribute("height", dims.height);
            ghost.setAttribute("look-at", "#main-cam");

            ghost.addEventListener("click", function () {
                currentTapsLeft--;

                this.setAttribute("width", dims.width * 0.85);
                this.setAttribute("height", dims.height * 0.85);
                setTimeout(() => {
                    this.setAttribute("width", dims.width);
                    this.setAttribute("height", dims.height);
                }, 100);

                if (currentTapsLeft > 0) {
                    document.getElementById("message").innerText = `💥 Hit! ${currentTapsLeft} more taps!`;
                } else {
                    clearInterval(fleeTimer);
                    score++;
                    document.getElementById("score").innerText = `Ghosts Captured: ${score} / ${totalGhosts}`;

                    if (score < totalGhosts) {
                        document.getElementById("message").innerText = "🎉 Captured! Spawning Next...";
                        document.getElementById("sub-message").innerText = "";
                        container.innerHTML = "";
                        setTimeout(spawnNextRound, 1500);
                    } else {
                        // WINNER END STATE
                        clearInterval(timerInterval);
                        const finalTime = Math.floor((Date.now() - startTime) / 1000) + penaltyTime;

                        container.innerHTML = "";
                        document.getElementById("message").innerText = "🎉 GAME COMPLETE! 🎉";
                        document.getElementById("sub-message").innerText = "";

                        setTimeout(() => {
                            const modal = document.getElementById("start-modal");
                            document.getElementById("modal-title").innerText = `🏆 ${playerName}'s RESULT 🏆`;
                            document.getElementById("modal-desc").innerHTML = `<span style="font-size: 28px; color: #ffeb3b;">FINAL TIME: ${finalTime}s</span><br><br>Show this screen to declare your rank!`;
                            document.getElementById("player-name-input").style.display = "none";
                            document.getElementById("start-btn").innerText = "PLAY AGAIN";
                            document.getElementById("start-btn").setAttribute("onclick", "location.reload()");
                            modal.style.display = "flex";
                        }, 1000);
                    }
                }
            });

            container.appendChild(ghost);
            currentGhostEl = ghost;

            if (Math.random() > 0.5) {
                spawnDecoy(container, pos);
            }

            // FAST FLEE MECHANIC (3-second timer + tap count reset)
            fleeTimer = setInterval(() => {
                if (currentGhostEl && currentTapsLeft > 0) {
                    const newPos = getRandomPosition(2.5, 4.5);
                    currentGhostEl.setAttribute("position", `${newPos.x} ${newPos.y} ${newPos.z}`);
                    
                    // Reset tap requirement if failed to tap 3 times in time
                    currentTapsLeft = 3; 

                    document.getElementById("sub-message").innerText = "💨 FLED! TAP HITS RESET! FIND IT AGAIN!";
                    setTimeout(() => {
                        document.getElementById("sub-message").innerText = "⏱️ You have 3 seconds!";
                    }, 1200);
                }
            }, FLEE_INTERVAL_MS);
        }

        function spawnDecoy(container, realGhostPos) {
            let decoyPos = getRandomPosition(2.0, 4.0);
            while (Math.abs(decoyPos.x - realGhostPos.x) < 1.5) {
                decoyPos = getRandomPosition(2.0, 4.0);
            }

            const dims = getImageDimensions("#mumu1", GHOST_BASE_WIDTH);

            const decoy = document.createElement("a-image");
            decoy.setAttribute("class", "clickable");
            decoy.setAttribute("src", "#mumu1");
            decoy.setAttribute("position", `${decoyPos.x} ${decoyPos.y} ${decoyPos.z}`);
            decoy.setAttribute("width", dims.width);
            decoy.setAttribute("height", dims.height);
            decoy.setAttribute("look-at", "#main-cam");
            decoy.setAttribute("color", "#ff4757");

            decoy.addEventListener("click", function () {
                penaltyTime += 5;

                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000) + penaltyTime;
                document.getElementById("timer").innerText = `⏱️ Time: ${elapsedSeconds}s`;

                document.getElementById("sub-message").innerText = "❌ DECOY! +5 SECONDS PENALTY! 🚨";

                const newDecoyPos = getRandomPosition(2.0, 4.0);
                this.setAttribute("position", `${newDecoyPos.x} ${newDecoyPos.y} ${newDecoyPos.z}`);
            });

            container.appendChild(decoy);
        }
    </script>
</body>
</html>
