<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mumu Room Hunt - Challenge Mode</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Look-at Component (Ghosts auto-face camera) -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Overlay UI */
        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 5px black;
            pointer-events: none;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        #sub-message {
            font-size: 16px;
            color: #ff4757;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        #score {
            font-size: 18px;
            margin: 0;
        }

        /* Start Screen Modal */
        #start-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-btn {
            margin-top: 20px;
            padding: 15px 32px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        /* Webcam Background Stream */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* A-Frame Canvas Overlay */
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Camera Background Feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Top UI -->
    <div id="ui">
        <p id="message">SEARCH THE ROOM!</p>
        <p id="sub-message">⚠️ BEWARE OF DECOYS!</p>
        <p id="score">Ghosts Captured: 0 / 5</p>
    </div>

    <!-- Start Overlay -->
    <div id="start-modal">
        <h2>Mumu Room Hunt</h2>
        <p>• Ghosts require 3 taps to capture.<br>
           • They run away if you take too long!<br>
           • Avoid clicking the RED DECOY ghost!</p>
        <button id="start-btn" onclick="startGame()">START HUNT</button>
    </div>

    <!-- A-Frame 3D Scene -->
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <!-- Reusing existing uploaded images -->
        <a-assets>
            <img id="mumu1" src="assets/mumu1.png">
            <img id="mumu2" src="assets/mumu2.png">
            <img id="mumu3" src="assets/mumu3.png">
        </a-assets>

        <!-- Camera with Gyroscope Controls -->
        <a-camera id="main-cam" look-controls="magicWindowTrackingEnabled: true"></a-camera>

        <!-- Container for Spawning Entities -->
        <a-entity id="ghost-container"></a-entity>

    </a-scene>

    <script>
        let score = 0;
        const totalGhosts = 5;
        let currentTapsLeft = 3;
        let fleeTimer = null;
        let currentGhostEl = null;

        const ghostAssets = ["#mumu1", "#mumu2", "#mumu3"];

        // Setup Webcam Stream
        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                document.getElementById("webcam").srcObject = stream;
            } catch (err) {
                alert("Camera access denied.");
            }
        }

        // Start Game Handler
        async function startGame() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (e) {
                    console.error(e);
                }
            }

            await setupWebcam();
            document.getElementById("start-modal").style.display = "none";
            spawnNextRound();
        }

        // Helper: Generate random coordinates around player
        function getRandomPosition(minDist = 2.0, maxDist = 4.0) {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * (maxDist - minDist) + minDist;
            const x = Math.cos(angle) * distance;
            const z = Math.sin(angle) * distance;
            const y = (Math.random() * 1.0) - 0.2;
            return { x: x.toFixed(2), y: y.toFixed(2), z: z.toFixed(2) };
        }

        // Sequential Spawn Controller
        function spawnNextRound() {
            const container = document.getElementById("ghost-container");
            container.innerHTML = ""; // Clear existing elements
            if (fleeTimer) clearInterval(fleeTimer);

            currentTapsLeft = 3;
            document.getElementById("message").innerText = `👻 Ghost #${score + 1} Sighted! Tap 3 Times!`;
            document.getElementById("sub-message").innerText = "⚠️ It will run away if you wait!";

            // 1. SPAWN TARGET GHOST
            const realAsset = ghostAssets[Math.floor(Math.random() * ghostAssets.length)];
            const pos = getRandomPosition(2.0, 4.0);

            const ghost = document.createElement("a-image");
            ghost.setAttribute("class", "clickable");
            ghost.setAttribute("src", realAsset);
            ghost.setAttribute("position", `${pos.x} ${pos.y} ${pos.z}`);
            ghost.setAttribute("width", "2.8");
            ghost.setAttribute("height", "2.8");
            ghost.setAttribute("look-at", "#main-cam");

            // Multi-Tap Click Event
            ghost.addEventListener("click", function () {
                currentTapsLeft--;

                // Visual tap bounce effect
                this.setAttribute("width", "2.2");
                setTimeout(() => this.setAttribute("width", "2.8"), 100);

                if (currentTapsLeft > 0) {
                    document.getElementById("message").innerText = `💥 Hit! Tap ${currentTapsLeft} more times!`;
                } else {
                    // Captured!
                    clearInterval(fleeTimer);
                    score++;
                    document.getElementById("score").innerText = `Ghosts Captured: ${score} / ${totalGhosts}`;

                    if (score < totalGhosts) {
                        document.getElementById("message").innerText = "🎉 Captured! Spawning Next...";
                        document.getElementById("sub-message").innerText = "";
                        container.innerHTML = "";
                        setTimeout(spawnNextRound, 1500);
                    } else {
                        document.getElementById("message").innerText = "🎉 YOU CLEARED THE HUNT! 🎉";
                        document.getElementById("sub-message").innerText = "All Mumus caught!";
                        container.innerHTML = "";
                    }
                }
            });

            container.appendChild(ghost);
            currentGhostEl = ghost;

            // 2. SPAWN DECOY GHOST (Reuses #mumu1 with a red tint, 50% chance each round)
            if (Math.random() > 0.5) {
                spawnDecoy(container, pos);
            }

            // 3. RUN AWAY / FLEE MECHANIC (Relocates every 6 seconds if not caught)
            fleeTimer = setInterval(() => {
                if (currentGhostEl && currentTapsLeft > 0) {
                    const newPos = getRandomPosition(2.5, 4.5);
                    currentGhostEl.setAttribute("position", `${newPos.x} ${newPos.y} ${newPos.z}`);
                    document.getElementById("sub-message").innerText = "💨 IT FLEW AWAY TO A NEW SPOT!";
                    setTimeout(() => {
                        document.getElementById("sub-message").innerText = "⚠️ Catch it before it moves again!";
                    }, 1500);
                }
            }, 6000);
        }

        // Decoy Spawner using existing image asset + color tint
        function spawnDecoy(container, realGhostPos) {
            let decoyPos = getRandomPosition(2.0, 4.0);
            
            // Ensure decoy doesn't spawn right on top of real ghost
            while (Math.abs(decoyPos.x - realGhostPos.x) < 1.5) {
                decoyPos = getRandomPosition(2.0, 4.0);
            }

            const decoy = document.createElement("a-image");
            decoy.setAttribute("class", "clickable");
            decoy.setAttribute("src", "#mumu1"); // Reuses mumu1.png
            decoy.setAttribute("position", `${decoyPos.x} ${decoyPos.y} ${decoyPos.z}`);
            decoy.setAttribute("width", "2.8");
            decoy.setAttribute("height", "2.8");
            decoy.setAttribute("look-at", "#main-cam");

            // Reddish tint applied via code to signal it's a fake clone
            decoy.setAttribute("color", "#ff4757");

            // Decoy Penalty Click
            decoy.addEventListener("click", function () {
                document.getElementById("sub-message").innerText = "❌ TRICKED! That was a RED DECOY!";
                
                // Relocate decoy on click
                const newDecoyPos = getRandomPosition(2.0, 4.0);
                this.setAttribute("position", `${newDecoyPos.x} ${newDecoyPos.y} ${newDecoyPos.z}`);
            });

            container.appendChild(decoy);
        }
    </script>
</body>
</html>
