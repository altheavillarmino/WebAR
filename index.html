<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mumu Hunt</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Look-at Component (Ghosts auto-face camera) -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Overlay UI */
        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 5px black;
            pointer-events: none;
        }

        #message {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        #score {
            font-size: 18px;
            margin: 0;
        }

        /* Start Screen Modal */
        #start-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #start-btn {
            margin-top: 20px;
            padding: 15px 32px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #ff4757;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        /* Webcam Background Stream */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* A-Frame Canvas Overlay */
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Camera Background Feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Top UI -->
    <div id="ui">
        <p id="message">👀 LOOK AROUND THE ROOM! 😱</p>
        <p id="score">Mumu Found: 0 / 3</p>
    </div>

    <!-- Start Overlay -->
    <div id="start-modal">
        <h2>Mumu Room Hunt</h2>
        <p>Rotate your phone 360° around your room to locate all hidden ghosts.</p>
        <button id="start-btn" onclick="startGame()">START HUNT</button>
    </div>

    <!-- A-Frame 3D Scene -->
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <!-- Unique Assets -->
        <a-assets>
            <img id="mumu1" src="assets/mumu1.png">
            <img id="mumu2" src="assets/mumu2.png">
            <img id="mumu3" src="assets/mumu3.png">
        </a-assets>

        <!-- Camera with Gyroscope Controls -->
        <a-camera id="main-cam" look-controls="magicWindowTrackingEnabled: true"></a-camera>

        <!-- Container for Ghosts -->
        <a-entity id="ghost-container"></a-entity>

    </a-scene>

    <script>
        let score = 0;
        const totalGhosts = 3;

        // Initialize Webcam
        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                const videoElement = document.getElementById("webcam");
                videoElement.srcObject = stream;
            } catch (err) {
                alert("Camera access denied or unavailable.");
                console.error(err);
            }
        }

        // Start Game Handler
        async function startGame() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert("Permission to access motion sensors was denied.");
                        return;
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            await setupWebcam();
            document.getElementById("start-modal").style.display = "none";
            spawnGhostsRandomly();
        }

        // Random Spawner Function
        function spawnGhostsRandomly() {
            const container = document.getElementById("ghost-container");
            const assets = ["#mumu1", "#mumu2", "#mumu3"];

            // HUMAN SCALE SIZE (2.8m x 2.8m)
            const ghostWidth = 2.8; 
            const ghostHeight = 2.8;

            assets.forEach((asset, index) => {
                const ghost = document.createElement("a-image");

                // Generate random angle in radians (0 to 360 degrees)
                const angle = Math.random() * Math.PI * 2;

                // Set random distance: 1 ghost spawns close (1.5m to 2.2m away), others further (2.5m to 4m away)
                const distance = (index === 0) 
                    ? (Math.random() * 0.7 + 1.5)  // Jumpscare/Close ghost
                    : (Math.random() * 1.5 + 2.5); // Outer ghosts

                // Calculate X and Z positions using trigonometry
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;

                // Random Y height around eye level (-0.3m to +0.8m offset)
                const y = (Math.random() * 1.1) - 0.3;

                ghost.setAttribute("id", `ghost${index + 1}`);
                ghost.setAttribute("class", "clickable");
                ghost.setAttribute("src", asset);
                ghost.setAttribute("position", `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`);
                ghost.setAttribute("width", ghostWidth);
                ghost.setAttribute("height", ghostHeight);
                ghost.setAttribute("look-at", "#main-cam");

                // Click / Tap Handler
                ghost.addEventListener("click", function () {
                    if (this.getAttribute("visible") === "false") return;

                    this.setAttribute("visible", "false");
                    score++;

                    document.getElementById("score").innerText = `Mumu Found: ${score} / ${totalGhosts}`;

                    if (score === totalGhosts) {
                        document.getElementById("message").innerText = "🎉 YOU CLEARED THE ROOM! 🎉";
                    }
                });

                container.appendChild(ghost);
            });
        }
    </script>
</body>
</html>
